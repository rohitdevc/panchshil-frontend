services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_API_ENDPOINT: ${NEXT_PUBLIC_BASE_API_ENDPOINT}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        X_SECRET_KEY: ${X_SECRET_KEY}

    container_name: panchshil-frontend

    ports:
      - "2982:2982"

    env_file:
      - .env

    volumes:
      - ./public:/app/public

    restart: unless-stopped
