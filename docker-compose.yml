services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_API_ENDPOINT: ${NEXT_PUBLIC_BASE_API_ENDPOINT}

    container_name: panchshil-nextjs

    ports:
      - "2982:2982"

    env_file:
      - .env

    volumes:
      - ./public:/app/public

    restart: unless-stopped
